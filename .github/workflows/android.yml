# Gera o APK do app Android e publica em Releases > "android".
# O site continua vindo da Vercel; só precisa rodar de novo quando android-app/ mudar.
name: App Android

on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Chave fixa (para o APK novo instalar por cima do antigo)
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::Falta o secret ANDROID_DEBUG_KEYSTORE"; exit 1; fi
          mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: Build
        working-directory: android-app
        run: |
          npm ci
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Knoweb.apk

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "App Android" --notes "Baixe o Knoweb.apk no celular e instale."
          gh release upload android Knoweb.apk --clobber
